openapi: 3.0.3
info:
  title: Transfer Core API
  version: 0.1.0-FROZEN
  description: |
    Контракт Northwind Transfer Core (Level 1-3).
    Status: FROZEN after SDD Gate 2 — изменения только через amend.

servers:
  - url: http://localhost:8080

paths:
  /quotes:
    post:
      summary: Create quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '201':
          description: Quote created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /quotes/{quote_id}:
    get:
      summary: Get quote
      parameters:
        - name: quote_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '404':
          $ref: '#/components/responses/Error'

  /transfers:
    post:
      summary: Create transfer from quote
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '202':
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferCreated'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /transfers/{transfer_id}:
    get:
      summary: Transfer status and history
      parameters:
        - name: transfer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferDetail'
        '404':
          $ref: '#/components/responses/Error'

  /clients/{client_id}/balance:
    get:
      summary: Client balances
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientBalance'
        '404':
          $ref: '#/components/responses/Error'

  /webhooks/{provider_id}:
    post:
      summary: Provider payout status webhook
      parameters:
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
        - name: X-Signature
          in: header
          required: false
          schema:
            type: string
            description: hex(HMAC-SHA256(body, PROVIDER_WEBHOOK_SECRET))
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Accepted (including duplicates/unknown)

components:
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3

    QuoteRequest:
      type: object
      required:
        - source_country
        - source_currency
        - target_country
        - target_currency
        - payout_method
        - amount
        - amount_type
      properties:
        source_country:
          type: string
        source_currency:
          type: string
        target_country:
          type: string
        target_currency:
          type: string
        payout_method:
          type: string
        amount:
          type: string
        amount_type:
          type: string
          enum: [SOURCE, TARGET]

    QuoteResponse:
      type: object
      required:
        - quote_id
        - direction_id
        - source_amount
        - fee
        - amount_to_convert
        - rate
        - target_amount
        - breakdown
        - expires_at
      properties:
        quote_id:
          type: string
        direction_id:
          type: string
        source_amount:
          $ref: '#/components/schemas/Money'
        fee:
          $ref: '#/components/schemas/Money'
        amount_to_convert:
          $ref: '#/components/schemas/Money'
        rate:
          type: string
        target_amount:
          $ref: '#/components/schemas/Money'
        breakdown:
          type: array
          items:
            type: object
            additionalProperties: true
        expires_at:
          type: string
          format: date-time

    TransferRequest:
      type: object
      required: [quote_id, client_id, recipient]
      properties:
        quote_id:
          type: string
        client_id:
          type: string
        recipient:
          type: object
          additionalProperties: true

    TransferCreated:
      type: object
      required: [transfer_id, status]
      properties:
        transfer_id:
          type: string
        status:
          type: string
          enum: [CREATED, RESERVED, SUBMITTING, PROCESSING, COMPLETED, FAILED, NEEDS_REVIEW]

    TransferDetail:
      type: object
      required: [transfer_id, status, quote_id, client_id]
      properties:
        transfer_id:
          type: string
        status:
          type: string
        quote_id:
          type: string
        client_id:
          type: string
        source_amount:
          $ref: '#/components/schemas/Money'
        target_amount:
          $ref: '#/components/schemas/Money'
        transitions:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
              at:
                type: string
                format: date-time
              reason:
                type: string
        provider_attempts:
          type: array
          items:
            type: object
            properties:
              provider_id:
                type: string
              attempted_at:
                type: string
                format: date-time
              result:
                type: string
              payout_id:
                type: string

    ClientBalance:
      type: object
      required: [client_id, balances]
      properties:
        client_id:
          type: string
        balances:
          type: array
          items:
            type: object
            required: [currency, available, reserved]
            properties:
              currency:
                type: string
              available:
                type: string
              reserved:
                type: string

    WebhookEvent:
      type: object
      required: [event_id, payout_id, reference, status, occurred_at]
      properties:
        event_id:
          type: string
        payout_id:
          type: string
        reference:
          type: string
        status:
          type: string
          enum: [PROCESSING, COMPLETED, FAILED]
        occurred_at:
          type: string
          format: date-time

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
